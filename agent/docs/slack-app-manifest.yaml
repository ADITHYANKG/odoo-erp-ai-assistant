display_information:
  name: Acme AI
  description: Ask your company's Odoo data in plain language.
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Acme AI
    always_online: true
  slash_commands:
    - command: /odoo
      description: Connect to Odoo, start over, or ask a question
      usage_hint: "login | new | brief off | forget | logout | help | <question>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - files:read
      - files:write
      - im:history
      - im:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
